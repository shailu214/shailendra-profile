name: 🚀 Deploy Portfolio Website

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Backend Tests and Deployment
  backend-deploy:
    name: 🔧 Backend API Deployment
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: 📦 Install backend dependencies
      run: |
        cd backend
        npm install
        
    - name: 🧪 Run backend tests
      run: |
        cd backend
        npm run test
      env:
        NODE_ENV: test
        
    - name: 🔍 Backend security audit
      continue-on-error: true
      run: |
        cd backend
        npm audit --audit-level moderate
        
    - name: 🚀 Deploy to Vercel (Backend)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      run: |
        npm install --global vercel@latest
        vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        
  # Frontend Build and Deployment  
  frontend-deploy:
    name: 🎨 Frontend Deployment
    runs-on: ubuntu-latest
    needs: backend-deploy
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 📦 Install frontend dependencies
      run: |
        cd frontend
        rm -f package-lock.json
        npm install
        
    - name: 🏗️ Build frontend
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
        
    - name: 🔍 Frontend security audit
      continue-on-error: true
      run: |
        cd frontend
        npm audit --audit-level moderate
        
    - name: 🚀 Deploy to Vercel (Frontend)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
      run: |
        npm install --global vercel@latest
        vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        
  # Database Seeding (Production)
  seed-production:
    name: 🌱 Production Database Seeding
    runs-on: ubuntu-latest
    needs: [backend-deploy, frontend-deploy]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📦 Install backend dependencies
      run: |
        cd backend
        npm install
        
    - name: 🌱 Seed production database (if needed)
      run: |
        cd backend
        npm run seed:prod
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        NODE_ENV: production
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        SITE_URL: ${{ secrets.SITE_URL }}
        
  # Health Check and Notification
  health-check:
    name: 🔍 Deployment Health Check
    runs-on: ubuntu-latest
    needs: [backend-deploy, frontend-deploy]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: 🏥 Health check backend API
      run: |
        sleep 30  # Wait for deployment to complete
        curl -f ${{ secrets.BACKEND_URL }}/api/health || exit 1
        
    - name: 🏥 Health check frontend
      run: |
        curl -f ${{ secrets.FRONTEND_URL }} || exit 1
        
    - name: 📧 Notify deployment success
      if: success()
      run: |
        echo "✅ Deployment successful!"
        echo "🌐 Frontend: ${{ secrets.FRONTEND_URL }}"
        echo "🔧 Backend API: ${{ secrets.BACKEND_URL }}"
        
    - name: ❌ Notify deployment failure  
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        exit 1